name: Validate and publish desktop installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webtool/package-lock.json
      - name: Install WebTool dependencies
        working-directory: webtool
        run: npm ci --no-audit --no-fund
      - name: Validate WebTool
        working-directory: webtool
        run: |
          npm run lint
          npm run build
          node --test tests/rendered-html.test.mjs
          PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Validate Windows bootstrap without downloads
        run: |
          MKVA_BOOTSTRAP_TEST=1 bash windows-launcher/bootstrap-wsl.sh
          bash windows-launcher/tests/test-bootstrap-update.sh
      - name: Validate managed Windows service start
        run: |
          test_root="$(mktemp -d)"
          trap 'rm -rf "$test_root"' EXIT
          mkdir -p "$test_root/bin" "$test_root/picker"
          ln -s "$(command -v node)" "$test_root/bin/node"
          ln -s "$(command -v npm)" "$test_root/bin/npm"
          touch "$test_root/picker/heartbeat"
          MKVA_TEST_PROJECT="$GITHUB_WORKSPACE"           MKVA_TEST_NODE_ENV_BIN="$test_root/bin"           MKVA_TEST_NEXTFLOW=/bin/true           MKVA_TEST_JAVA=/bin/true           MKVA_TEST_PICKER_DIR="$test_root/picker"             bash windows-launcher/tests/test-managed-start.sh
      - name: Validate Ubuntu launcher without downloads
        run: bash linux-launcher/tests/test-linux-launcher.sh
      - name: Validate pipeline Python tools
        run: |
          python3 -m compileall -q bin webtool/local_api.py
          python3 -m unittest tests/test_gisaid_submission.py tests/test_metadata_typing.py -v

  windows-installer:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build self-contained installer
        shell: pwsh
        run: ./windows-launcher/build.ps1
      - name: Write checksum
        shell: pwsh
        run: |
          $file = 'windows-launcher/output/MK-Viral-Assembly-Setup.exe'
          $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MK-Viral-Assembly-Setup.exe" | Set-Content 'windows-launcher/output/MK-Viral-Assembly-Setup.exe.sha256' -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: MK-Viral-Assembly-Windows
          path: |
            windows-launcher/output/MK-Viral-Assembly-Setup.exe
            windows-launcher/output/MK-Viral-Assembly-Setup.exe.sha256

  ubuntu-package:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Ubuntu launcher
        run: bash linux-launcher/tests/test-linux-launcher.sh
      - name: Build Ubuntu package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            export MKVA_VERSION="${GITHUB_REF_NAME#v}"
          fi
          ./linux-launcher/build-deb.sh
      - name: Install and validate Ubuntu package
        run: |
          packages=(linux-launcher/output/*.deb)
          test "${#packages[@]}" -eq 1
          sudo apt-get update
          sudo apt-get install -y "./${packages[0]}"
          python3 -c 'import gi; gi.require_version("Gtk", "3.0"); gi.require_version("WebKit2", "4.1"); from gi.repository import Gtk, WebKit2'
          MKVA_WINDOW_TEST=1 /opt/mk-viral-assembly/mkva-window | grep -q '^MKVA_WINDOW_APP_ID=org.mkviralassembly.WebTool$'
      - uses: actions/upload-artifact@v4
        with:
          name: MK-Viral-Assembly-Ubuntu
          path: |
            linux-launcher/output/*.deb
            linux-launcher/output/*.sha256

  ubuntu-compatibility:
    needs: ubuntu-package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MK-Viral-Assembly-Ubuntu
          path: package-assets
      - name: Install and validate package on Ubuntu 24.04
        run: |
          packages=(package-assets/*.deb)
          test "${#packages[@]}" -eq 1
          sudo apt-get update
          sudo apt-get install -y "./${packages[0]}"
          python3 -c 'import gi; gi.require_version("Gtk", "3.0"); gi.require_version("WebKit2", "4.1"); from gi.repository import Gtk, WebKit2'
          MKVA_WINDOW_TEST=1 /opt/mk-viral-assembly/mkva-window | grep -q '^MKVA_WINDOW_APP_ID=org.mkviralassembly.WebTool$'

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - windows-installer
      - ubuntu-package
      - ubuntu-compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: MK-Viral-Assembly-*
          path: release-assets
          merge-multiple: true
      - name: Verify release assets
        run: |
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f | sort)
          if [[ "${#assets[@]}" -ne 4 ]]; then
            printf 'Expected four release files, found %s.\n' "${#assets[@]}" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi
          test -f release-assets/MK-Viral-Assembly-Setup.exe
          test -f release-assets/MK-Viral-Assembly-Setup.exe.sha256
          test -f "release-assets/MK-Viral-Assembly-WebTool_${GITHUB_REF_NAME#v}_amd64.deb"
          test -f "release-assets/MK-Viral-Assembly-WebTool_${GITHUB_REF_NAME#v}_amd64.deb.sha256"
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes --title "MK-Viral-Assembly $GITHUB_REF_NAME"
          fi
